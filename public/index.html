<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Derstayım · English Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="crown" viewBox="0 0 24 16">
      <path d="M1 2l5.5 6L12 1l5.5 7L23 2l-2.5 13h-17z" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- Yükleniyor -->
  <section id="loading" class="screen loading">
    <span class="brand stacked"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
  </section>

  <!-- Giriş -->
  <section id="login" class="screen login" hidden>
    <div class="splash">
      <span class="lang-switch on-yellow"><button data-lang="tr">TR</button><button data-lang="en">EN</button></span>
      <span class="brand stacked dark"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
      <h1 class="script">Derstayım<svg class="spark" viewBox="0 0 30 30"><path d="M4 16l9-2M8 6l6 6M18 3l-1 8" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg></h1>
      <p class="splash-sub" data-i18n="splash_sub"></p>
      <div class="art">
        <div class="bubble" data-i18n="bubble"></div>
        <svg class="alarm" viewBox="0 0 160 160" aria-hidden="true">
          <g fill="none" stroke="#111" stroke-width="9" stroke-linecap="round">
            <circle cx="80" cy="88" r="50"/>
            <path d="M80 60v30l18 12"/>
            <path d="M45 132l-12 14M115 132l12 14"/>
            <path d="M14 30l8 10M8 52l12 3M36 12l4 12" stroke-width="6"/>
          </g>
          <path d="M28 52a24 24 0 0 1 34-30z" fill="#111"/>
          <path d="M132 52a24 24 0 0 0-34-30z" fill="#111"/>
        </svg>
      </div>
      <svg class="hill" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 80V40C60 10 120 60 200 40S330 0 400 30V80z" fill="#111"/>
      </svg>
    </div>
    <div class="login-sheet">
      <h2 data-i18n="welcome"></h2>
      <p class="muted" data-i18n="login_desc"></p>
      <button id="loginBtn" class="btn btn-yellow btn-lg">
        <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#111" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
        <span data-i18n="login_btn"></span>
      </button>
      <p class="fine" data-i18n="login_fine"></p>
    </div>
    <footer class="login-foot">
      <svg viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60V30C80 0 160 50 240 30S360 0 400 20V60z" fill="#FFD21F"/><path d="M0 60V44C90 20 170 60 260 44S370 24 400 36V60z" fill="#111"/></svg>
      <span class="brand"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
    </footer>
  </section>

  <!-- Öğrenci: Ana sayfa -->
  <section id="s-home" class="page" hidden>
    <header class="hero">
      <div class="hero-top">
        <span class="brand"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
        <span id="sLive" class="live"></span>
      </div>
      <h1 id="sHello"></h1>
      <p data-i18n="s_sub"></p>
    </header>
    <div class="content">
      <div class="card today">
        <span class="icon-box" data-icon="calendar"></span>
        <div class="today-text">
          <small data-i18n="today_label"></small>
          <b>English Time</b>
          <span id="sDate"></span>
        </div>
        <span id="sClock" class="today-clock"></span>
      </div>

      <button id="checkin" class="checkin" hidden>
        <span class="checkin-row"><span class="check-dot" data-icon="check"></span><span data-i18n="checkin"></span></span>
        <span class="checkin-sub" data-i18n="checkin_sub"></span>
      </button>
      <div id="sStatus" class="status-card" hidden>
        <span id="sStatusIcon" class="status-icon"></span>
        <div>
          <b id="sStatusTitle"></b>
          <span id="sStatusText"></span>
        </div>
      </div>

      <div class="tiles">
        <button class="tile" data-go="s-history">
          <span data-icon="history"></span>
          <b data-i18n="history"></b>
          <small data-i18n="history_sub"></small>
        </button>
        <button class="tile" data-go="profile">
          <span data-icon="user"></span>
          <b data-i18n="my_profile"></b>
          <small data-i18n="my_profile_sub"></small>
        </button>
      </div>

      <div id="wotd" class="card wotd"></div>
    </div>
  </section>

  <!-- Öğrenci: Geçmiş -->
  <section id="s-history" class="page" hidden>
    <header class="hero small">
      <h1 data-i18n="history"></h1>
      <p data-i18n="history_last"></p>
    </header>
    <div class="content">
      <div class="card stats">
        <div><span class="dot ok" data-icon="check"></span><small data-i18n="present"></small><b id="hOk">0</b></div>
        <div><span class="dot wait" data-icon="clock"></span><small data-i18n="pending"></small><b id="hWait">0</b></div>
        <div><span class="dot no" data-icon="x"></span><small data-i18n="rejected_short"></small><b id="hNo">0</b></div>
      </div>
      <ul id="hList" class="rows"></ul>
    </div>
  </section>

  <!-- Hoca: Yoklama -->
  <section id="t-home" class="page" hidden>
    <header class="hero">
      <div class="hero-top">
        <span class="brand"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
        <span id="tLive" class="live"></span>
      </div>
      <h1 id="tHello"></h1>
      <p data-i18n="t_sub"></p>
    </header>
    <div class="content">
      <div class="card lesson">
        <div class="lesson-head">
          <span class="icon-box" data-icon="clock"></span>
          <div>
            <b data-i18n="today_label"></b>
            <span id="tDate" class="muted"></span>
          </div>
        </div>
        <div class="stats inline">
          <div><span class="dot ok" data-icon="check"></span><small data-i18n="attended"></small><b id="nOk">0</b></div>
          <div><span class="dot wait" data-icon="clock"></span><small data-i18n="pending"></small><b id="nWait">0</b></div>
          <div><span class="dot all" data-icon="users"></span><small data-i18n="total"></small><b id="nAll">0</b></div>
        </div>
        <div class="lesson-actions">
          <button id="approveAll" class="btn btn-yellow">Hepsini onayla</button>
          <button id="toggleSession" class="btn btn-outline">Yoklamayı kapat</button>
        </div>
      </div>

      <h3 class="section-title" data-i18n="live_list"></h3>
      <label class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" data-i18n-ph="search" autocomplete="off">
      </label>
      <ul id="tList" class="rows"></ul>
    </div>
  </section>

  <!-- Profil (ikisi için ortak) -->
  <section id="profile" class="page" hidden>
    <header class="hero profile-hero">
      <h1 data-i18n="profile"></h1>
      <div class="me">
        <span id="pAvatar" class="avatar xl"></span>
        <div>
          <b id="pName"></b>
          <span id="pEmail"></span>
        </div>
      </div>
    </header>
    <div class="content">
      <ul class="menu">
        <li><span data-icon="shield"></span><span data-i18n="role"></span><em id="pRole"></em></li>
        <li id="pStatRow"><span data-icon="check"></span><span data-i18n="approved_count"></span><em id="pStat"></em></li>
        <li><span data-icon="clock"></span><span data-i18n="timezone"></span><em data-i18n="timezone_val"></em></li>
        <li><span data-icon="info"></span><span data-i18n="app"></span><em>Derstayım</em></li>
        <li><span data-icon="globe"></span><span data-i18n="language"></span>
          <span class="lang-switch"><button data-lang="tr">TR</button><button data-lang="en">EN</button></span></li>
        <li><button id="logout" class="menu-btn"><span data-icon="logout"></span><span data-i18n="logout"></span></button></li>
      </ul>
      <p class="fine center" data-i18n="footer"></p>
    </div>
  </section>

  <nav id="tabbar" class="tabbar" hidden></nav>

  <!-- Başarı ekranı -->
  <div id="success" class="success" hidden>
    <div class="success-top">
      <span class="brand dark"><span>English</span><span class="t">Time<svg class="crown"><use href="#crown"/></svg></span></span>
      <button id="successClose" class="x" data-icon="x" aria-label="Kapat"></button>
    </div>
    <div class="burst">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      <span class="big-check" data-icon="check"></span>
    </div>
    <h2 data-i18n="success_title"></h2>
    <p data-i18n="success_text"></p>
    <div class="stamp-card">
      <span data-icon="clock"></span>
      <div>
        <small data-i18n="checkin_time"></small>
        <b id="successTime"></b>
        <small data-i18n="server_time"></small>
      </div>
    </div>
    <button id="successOk" class="btn btn-black btn-lg" data-i18n="ok"></button>
    <p class="goodjob">Good job! ☺</p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
