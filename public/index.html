<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Derstayım · English Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@700&family=Jost:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Big Ben (logodaki kule). Delikler --logo-bg rengiyle boyanır. -->
    <symbol id="ben" viewBox="0 0 64 240">
      <g fill="currentColor">
        <polygon points="32,0 35,34 29,34"/>
        <rect x="27" y="34" width="10" height="5"/>
        <polygon points="18,78 32,39 46,78"/>
        <rect x="15" y="78" width="34" height="5"/>
        <rect x="17" y="83" width="30" height="20"/>
        <rect x="13" y="103" width="38" height="5"/>
        <polygon points="11,108 13,95 15,108"/>
        <polygon points="49,108 51,95 53,108"/>
        <rect x="13" y="108" width="38" height="42"/>
        <rect x="12" y="150" width="40" height="5"/>
        <rect x="15" y="155" width="34" height="79"/>
        <rect x="12" y="234" width="40" height="6"/>
      </g>
      <g style="fill: var(--logo-bg)">
        <rect x="30.5" y="52" width="3" height="7"/>
        <rect x="26" y="64" width="2.5" height="7"/>
        <rect x="35.5" y="64" width="2.5" height="7"/>
        <rect x="21" y="87" width="5" height="13" rx="2.5"/>
        <rect x="29.5" y="87" width="5" height="13" rx="2.5"/>
        <rect x="38" y="87" width="5" height="13" rx="2.5"/>
        <circle cx="32" cy="129" r="14"/>
        <rect x="19" y="160" width="3.5" height="17"/><rect x="26.5" y="160" width="3.5" height="17"/>
        <rect x="34" y="160" width="3.5" height="17"/><rect x="41.5" y="160" width="3.5" height="17"/>
        <rect x="19" y="183" width="3.5" height="19"/><rect x="26.5" y="183" width="3.5" height="19"/>
        <rect x="34" y="183" width="3.5" height="19"/><rect x="41.5" y="183" width="3.5" height="19"/>
        <rect x="19" y="208" width="3.5" height="20"/><rect x="26.5" y="208" width="3.5" height="20"/>
        <rect x="34" y="208" width="3.5" height="20"/><rect x="41.5" y="208" width="3.5" height="20"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="32" cy="129" r="11" stroke-width="1.4"/>
        <path d="M32 120v2M32 136v2M23 129h2M39 129h2" stroke-width="1.4"/>
        <path d="M32 129v-7M32 129l5 3" stroke-width="2"/>
      </g>
      <circle cx="32" cy="129" r="1.8" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- Yükleniyor -->
  <section id="loading" class="screen loading">
    <span class="logo xl" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
  </section>

  <!-- Giriş -->
  <section id="login" class="screen login" hidden>
    <div class="splash">
      <span class="lang-switch on-yellow"><button data-lang="tr">TR</button><button data-lang="en">EN</button></span>
      <div class="splash-logo">
        <span class="logo xl" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
        <p class="logo-sub">DİL OKULU VE YURTDIŞI EĞİTİM DANIŞMANLIĞI</p>
      </div>
      <div class="app-badge">
        <span class="script">Derstayım</span>
        <span class="splash-sub" data-i18n="splash_sub"></span>
      </div>
      <svg class="hill" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 80V40C60 10 120 60 200 40S330 0 400 30V80z" fill="#111"/>
      </svg>
    </div>
    <div class="login-sheet">
      <h2 data-i18n="welcome"></h2>
      <p class="muted" data-i18n="login_desc"></p>
      <button id="loginBtn" class="btn btn-yellow btn-lg">
        <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#111" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
        <span data-i18n="login_btn"></span>
      </button>
      <button id="emailBtn" class="btn btn-outline btn-lg mt"><span data-icon="mail"></span><span data-i18n="email_btn"></span></button>
      <p class="center small"><span class="muted" data-i18n="no_account"></span> <button class="link" id="signupLink" data-i18n="signup"></button></p>
      <p class="fine" data-i18n="login_fine"></p>
    </div>
    <footer class="login-foot">
      <svg viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60V30C80 0 160 50 240 30S360 0 400 20V60z" fill="#FFD21F"/><path d="M0 60V44C90 20 170 60 260 44S370 24 400 36V60z" fill="#111"/></svg>
      <span class="logo on-dark" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
    </footer>
  </section>

  <!-- E-posta ile giriş / kayıt / şifre sıfırlama -->
  <section id="auth" class="screen auth" hidden>
    <div class="auth-top">
      <button id="authBack" class="icon-btn" data-icon="back" aria-label="Geri"></button>
      <span class="lang-switch"><button data-lang="tr">TR</button><button data-lang="en">EN</button></span>
    </div>
    <span class="logo" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
    <div id="authBody" class="auth-body"></div>
  </section>

  <!-- E-posta doğrulama -->
  <section id="verify" class="screen auth" hidden>
    <span class="logo" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
    <div class="auth-body center">
      <span class="big-icon" data-icon="mail"></span>
      <h2 data-i18n="verify_t"></h2>
      <p class="muted" id="verifyText"></p>
      <button id="verifyDone" class="btn btn-yellow btn-lg" data-i18n="verify_done"></button>
      <button id="verifyAgain" class="btn btn-outline btn-lg" data-i18n="verify_again"></button>
      <button id="verifyOut" class="link" data-i18n="logout"></button>
    </div>
  </section>

  <!-- Öğrenci: Ana sayfa -->
  <section id="s-home" class="page" hidden>
    <header class="hero">
      <div class="hero-top">
        <span class="logo on-dark" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
        <span id="sLive" class="live"></span>
      </div>
      <h1 id="sHello"></h1>
      <p data-i18n="s_sub"></p>
    </header>
    <div class="content">
      <div class="card today">
        <span class="icon-box" data-icon="calendar"></span>
        <div class="today-text">
          <small data-i18n="today_label"></small>
          <b>English Time</b>
          <span id="sDate"></span>
          <span id="sWindow" class="window"></span>
        </div>
        <span id="sClock" class="today-clock"></span>
      </div>

      <button id="checkin" class="checkin" hidden>
        <span class="checkin-row"><span class="check-dot" data-icon="check"></span><span data-i18n="checkin"></span></span>
        <span class="checkin-sub" data-i18n="checkin_sub"></span>
      </button>
      <div id="sStatus" class="status-card" hidden>
        <span id="sStatusIcon" class="status-icon"></span>
        <div>
          <b id="sStatusTitle"></b>
          <span id="sStatusText"></span>
        </div>
      </div>

      <button id="photoNudge" class="nudge" data-go="profile" hidden>
        <span class="nudge-icon" data-icon="camera"></span>
        <span class="nudge-text"><b data-i18n="photo_nudge_t"></b><span data-i18n="photo_nudge"></span></span>
        <span class="nudge-go">›</span>
      </button>

      <div class="tiles">
        <button class="tile" data-go="s-history">
          <span data-icon="history"></span>
          <b data-i18n="history"></b>
          <small data-i18n="history_sub"></small>
        </button>
        <button class="tile" data-go="profile">
          <span data-icon="user"></span>
          <b data-i18n="my_profile"></b>
          <small data-i18n="my_profile_sub"></small>
        </button>
      </div>

      <button id="wotd" class="card wotd"></button>
    </div>
  </section>

  <!-- Öğrenci: Geçmiş -->
  <section id="s-history" class="page" hidden>
    <header class="hero small">
      <h1 data-i18n="history"></h1>
      <p data-i18n="history_last"></p>
    </header>
    <div class="content">
      <div class="card stats">
        <div><span class="dot ok" data-icon="check"></span><small data-i18n="present"></small><b id="hOk">0</b></div>
        <div><span class="dot wait" data-icon="clock"></span><small data-i18n="pending"></small><b id="hWait">0</b></div>
        <div><span class="dot no" data-icon="x"></span><small data-i18n="rejected_short"></small><b id="hNo">0</b></div>
      </div>
      <ul id="hList" class="rows"></ul>
    </div>
  </section>

  <!-- Hoca: Yoklama -->
  <section id="t-home" class="page" hidden>
    <header class="hero">
      <div class="hero-top">
        <span class="logo on-dark" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
        <span id="tLive" class="live"></span>
      </div>
      <h1 id="tHello"></h1>
      <p data-i18n="t_sub"></p>
    </header>
    <div class="content">
      <div class="card lesson">
        <div class="lesson-head">
          <span class="icon-box" data-icon="clock"></span>
          <div class="grow">
            <b id="tDayLabel"></b>
            <span id="tDate" class="muted"></span>
            <span id="tWindow" class="window"></span>
          </div>
          <div class="day-nav">
            <button id="dayPrev" class="icon-btn" data-icon="chevL" aria-label="Önceki gün"></button>
            <button id="dayNext" class="icon-btn" data-icon="chevR" aria-label="Sonraki gün"></button>
          </div>
        </div>
        <div class="stats inline">
          <div><span class="dot ok" data-icon="check"></span><small data-i18n="attended"></small><b id="nOk">0</b></div>
          <div><span class="dot wait" data-icon="clock"></span><small data-i18n="pending"></small><b id="nWait">0</b></div>
          <div><span class="dot all" data-icon="users"></span><small data-i18n="total"></small><b id="nAll">0</b></div>
        </div>
        <div class="lesson-actions">
          <button id="approveAll" class="btn btn-yellow">Hepsini onayla</button>
          <button id="toggleSession" class="btn btn-outline">Yoklamayı kapat</button>
        </div>
      </div>

      <h3 id="tListTitle" class="section-title"></h3>
      <label class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" data-i18n-ph="search" autocomplete="off">
      </label>
      <ul id="tList" class="rows"></ul>
    </div>
  </section>

  <!-- Hoca: Geçmiş yoklamalar -->
  <section id="t-history" class="page" hidden>
    <header class="hero small">
      <h1 data-i18n="t_history"></h1>
      <p data-i18n="t_history_sub"></p>
    </header>
    <div class="content">
      <div class="card export-card">
        <div class="export-top">
          <button id="monPrev" class="icon-btn" data-icon="chevL" aria-label="Önceki ay"></button>
          <div class="export-title"><small data-i18n="export_t"></small><b id="monLabel"></b></div>
          <button id="monNext" class="icon-btn" data-icon="chevR" aria-label="Sonraki ay"></button>
        </div>
        <button id="exportBtn" class="btn btn-yellow btn-lg"><span data-icon="download"></span><span data-i18n="export_btn"></span></button>
        <p class="fine center" data-i18n="export_hint"></p>
      </div>
      <div class="card stats">
        <div><span class="dot all" data-icon="calendar"></span><small data-i18n="class_days"></small><b id="thDays">0</b></div>
        <div><span class="dot ok" data-icon="users"></span><small data-i18n="avg_present"></small><b id="thAvg">0</b></div>
        <div><span class="dot wait" data-icon="clock"></span><small data-i18n="pending"></small><b id="thWait">0</b></div>
      </div>
      <ul id="thList" class="rows"></ul>
    </div>
  </section>

  <!-- Profil (ikisi için ortak) -->
  <section id="profile" class="page" hidden>
    <header class="hero profile-hero">
      <h1 data-i18n="profile"></h1>
      <div class="me">
        <label class="avatar-edit">
          <span id="pAvatar" class="avatar xl"></span>
          <span class="cam" data-icon="camera"></span>
          <input id="photoInput" type="file" accept="image/*" hidden>
        </label>
        <div>
          <b id="pName"></b>
          <span id="pEmail"></span>
        </div>
      </div>
    </header>
    <div class="content">
      <div id="photoCard" class="card photo-card">
        <span class="photo-card-icon" data-icon="camera"></span>
        <div class="photo-card-text">
          <b id="photoTitle"></b>
          <span id="photoText"></span>
        </div>
        <div class="photo-card-acts">
          <button id="photoPick" class="btn btn-yellow btn-sm"></button>
          <button id="photoRemove" class="btn btn-outline btn-sm" data-i18n="photo_remove"></button>
        </div>
      </div>
      <ul class="menu">
        <li><span data-icon="shield"></span><span data-i18n="role"></span><em id="pRole"></em></li>
        <li id="pStatRow"><span data-icon="check"></span><span data-i18n="approved_count"></span><em id="pStat"></em></li>
        <li><span data-icon="calendar"></span><span data-i18n="class_hours"></span><em id="pHours"></em></li>
        <li><span data-icon="clock"></span><span data-i18n="timezone"></span><em data-i18n="timezone_val"></em></li>
        <li><span data-icon="info"></span><span data-i18n="app"></span><em>Derstayım</em></li>
        <li><span data-icon="globe"></span><span data-i18n="language"></span>
          <span class="lang-switch"><button data-lang="tr">TR</button><button data-lang="en">EN</button></span></li>
        <li><button id="logout" class="menu-btn"><span data-icon="logout"></span><span data-i18n="logout"></span></button></li>
      </ul>
      <p class="fine center" data-i18n="footer"></p>
    </div>
  </section>

  <nav id="tabbar" class="tabbar" hidden></nav>

  <!-- Başarı ekranı -->
  <div id="success" class="success" hidden>
    <div class="success-top">
      <span class="logo on-gold" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
      <button id="successClose" class="x" data-icon="x" aria-label="Kapat"></button>
    </div>
    <div class="burst">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      <span class="big-check" data-icon="check"></span>
    </div>
    <h2 data-i18n="success_title"></h2>
    <p data-i18n="success_text"></p>
    <div class="stamp-card">
      <span data-icon="clock"></span>
      <div>
        <small data-i18n="checkin_time"></small>
        <b id="successTime"></b>
        <small data-i18n="server_time"></small>
      </div>
    </div>
    <button id="successOk" class="btn btn-black btn-lg" data-i18n="ok"></button>
    <p class="goodjob">Good job! ☺</p>
  </div>

  <!-- Günün kelimesi (uygulama her açıldığında) -->
  <div id="wordModal" class="word-modal" hidden>
    <div class="word-sheet" role="dialog" aria-modal="true">
      <div class="word-top">
        <span class="logo" aria-label="English Time"><span class="l1">ENGLISH</span><svg class="ben" viewBox="0 0 64 240"><use href="#ben"/></svg><span class="l2">TIME</span></span>
        <span id="wmDate" class="word-date"></span>
      </div>
      <span class="word-kicker" data-i18n="word_kicker"></span>
      <h2 id="wmWord"></h2>
      <div class="word-meta">
        <span id="wmType" class="word-type"></span>
        <button id="wmSpeak" class="speak"><span data-icon="speaker"></span><span data-i18n="listen"></span></button>
      </div>
      <p id="wmTr" class="word-tr"></p>
      <div class="word-ex"><p id="wmEx"></p><p id="wmExTr"></p></div>
      <button id="wmOk" class="btn btn-black btn-lg" data-i18n="lets_go"></button>
    </div>
  </div>

  <!-- Fotoğrafı büyütme (hoca) -->
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" alt="">
    <b id="lightboxName"></b>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
