<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFD60A">
  <title>Derstayım · English Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Açılış ekranı: uygulama yüklenirken görünür -->
    <section class="splash">
      <div class="logo logo-lg"><span>English</span><span>Time</span><i class="logo-mark"></i></div>
      <h1 class="splash-title">Derstayım</h1>
      <p class="splash-sub">Ders + Stay (kalmak)</p>
      <div class="splash-art">
        <div class="bubble">Geldim,<br>kaydoldum,<br>dersteyim!</div>
        <svg class="alarm" viewBox="0 0 160 160" aria-hidden="true">
          <g fill="none" stroke="#111" stroke-width="7" stroke-linecap="round">
            <path d="M18 34 l10 10 M14 58 h12 M30 16 l6 12"/>
            <path d="M38 132 l-12 14 M122 132 l12 14"/>
          </g>
          <path d="M34 40 a22 22 0 0 1 32 -6 z" fill="#111"/>
          <path d="M126 40 a22 22 0 0 0 -32 -6 z" fill="#111"/>
          <circle cx="80" cy="88" r="50" fill="#FFD60A" stroke="#111" stroke-width="8"/>
          <path d="M80 60 v30 l18 12" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <svg class="wave" viewBox="0 0 400 140" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 70 C 90 10, 170 110, 260 60 S 370 20, 400 40 L400 140 L0 140 Z" fill="#111"/>
      </svg>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
